<!doctype html>
<html lang="es">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta charset="UTF-8" />
    <!-- maximum-scale=1: sin zoom automático al escribir ni ampliaciones accidentales; el zoom de la foto lo hace la app -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <!-- color de la barra de la hora (iPhone y Android) = color de la cabecera; el iPhone lo lee al abrir la app,
         por eso va aquí para claro y oscuro (src/datos/preferencias.ts lo ajusta si se fija un tema) -->
    <meta name="theme-color" content="#dde4f4" media="(prefers-color-scheme: light)" data-auto="#dde4f4" />
    <meta name="theme-color" content="#2b3249" media="(prefers-color-scheme: dark)" data-auto="#2b3249" />
    <!-- tema desde el primer instante (sin módulo ni espera: el iPhone fija la barra de la hora al abrir) -->
    <script src="./tema-inicial.js"></script>
    <!-- la app tiene tema claro y oscuro propios: así el navegador no la oscurece por su cuenta -->
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./iconos/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Colonias" />
    <title>Contador de colonias</title>
    <script type="module" crossorigin src="./assets/index-FXWOpmGo.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bykcu4GH.css">

</html>
